schema_version: 1
source_of_truth: docs/产品方案设计/VERTEX_PRO_V1_USER_RULES_CONTRACT.md
visible_labels:
  WAITING_RULE: 等待规则
  PREPARING_SEED: 准备种子
  WAITING_DOWNLOADER: 等待下载器
  ADDING: 正在添加
  DOWNLOADING: 下载中
  SEEDING: 做种中
  COMPLETED: 已完成
  DELETED: 已删除
  FAILED: 失败
  NEEDS_CONFIRMATION: 需确认
precedence:
  - NEEDS_CONFIRMATION
  - FAILED
  - DELETED
  - COMPLETED
  - SEEDING
  - DOWNLOADING
  - ADDING
  - WAITING_DOWNLOADER
  - PREPARING_SEED
  - WAITING_RULE
mapping:
  NEEDS_CONFIRMATION:
    when_any: [job_state=UNKNOWN, job_state=EXPIRED_UNKNOWN]
    rationale: unknown side effect remains active and must never be auto-replayed
  FAILED:
    when_any: [job_state=PREPARE_FAILED, job_state=ADD_FAILED, rule_state=REJECTED, torrent_state=FAILED]
    rationale: terminal failure or explicit rule rejection
  DELETED:
    when_any: [history_state=REMOVED_EXTERNALLY, deletion_fact=CONFIRMED]
    rationale: deletion is shown only after authoritative Sync confirmation
  COMPLETED:
    when_any: [observation_state=COMPLETED, torrent_observation=COMPLETED]
    rationale: completed state requires authoritative qB observation
  SEEDING:
    when_any: [torrent_observation=SEEDING]
    rationale: current qB observation is seeding
  DOWNLOADING:
    when_any: [torrent_observation=DOWNLOADING]
    rationale: current qB observation is downloading
  ADDING:
    when_any: [job_state=RESERVED, job_state=ADD_SENT, job_state=AWAITING_CONFIRMATION]
    rationale: delivery chain is active but confirmation is not terminal
  WAITING_DOWNLOADER:
    when_any: [job_state=WAITING_CAPACITY, placement_state=WAITING_CAPACITY, instance_available=false]
    rationale: no eligible verified downloader/capacity is currently available
  PREPARING_SEED:
    when_any: [job_state=PREPARING, rule_state=RUNNING, torrent_state=FETCHING, placement_state=PREPARED]
    rationale: rule, torrent or candidate preparation is in progress
  WAITING_RULE:
    when_any: [job_state=DISCOVERED, rule_state=PENDING]
    rationale: item has not entered an active preparation decision
safety:
  hidden_internal_terms: [Candidate, Placement, Reservation, Reflection, SubmitIntent, capacity_epoch]
  forbidden_success_mapping: [UNKNOWN, EXPIRED_UNKNOWN, CAPACITY_UNCERTAIN, SNAPSHOT_STALE, STORAGE_UNVERIFIED]
  diagnostic_only: [job_state, rule_state, torrent_state, placement_state, attempt_state, reservation_state, capacity_state]
