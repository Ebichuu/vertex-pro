name: vertex-pro-ci
on:
  push:
  pull_request:

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Check dispatch and preparation concurrency
        # -short excludes latency benchmarks; race instrumentation must not
        # weaken or be measured against the separate 100ms performance gate.
        run: go test -race -short -count=1 ./internal/startuprecover ./internal/dispatchstage ./internal/rssfetch ./internal/schedulercycle ./internal/rsssourcedb ./internal/app
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run local preflight
        shell: pwsh
        run: ./tools/dev/preflight.ps1
      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-evidence
          path: |
            artifacts/preflight/
            docs/evidence/boot-05/preflight-check.json
